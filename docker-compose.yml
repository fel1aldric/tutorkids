version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: tutorkids_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: tutorkids
      MYSQL_USER: tutorkids
      MYSQL_PASSWORD: tutorkids_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: tutorkids_backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql+pymysql://tutorkids:tutorkids_password@mysql:3306/tutorkids
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: gpt-oss:20b
      APP_SECRET_KEY: change-me-in-production-very-long-secret-key
      APP_ENV: development
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  mysql_data:
